<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUXE Admin</title><style>
body{font:15px Arial;background:#f5f7fb;color:#182238;margin:0;padding:20px}main{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:18px;margin:14px 0}input,select,button{padding:11px;border:1px solid #dce3ec;border-radius:8px;margin:4px}button{background:#286fe0;color:white;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}
</style></head><body><main><h1>LUXE TOP UP · Admin</h1><div class="card"><label>Admin Token <input id="token" type="password" placeholder="Enter ADMIN_TOKEN"></label><button onclick="load()">Load Orders</button><p id="msg"></p></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Game / Player</th><th>Package</th><th>Amount</th><th>Status</th><th>Update</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script>
async function load(){const t=document.getElementById('token').value;const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok){document.getElementById('msg').textContent=d.error;return}document.getElementById('msg').textContent=d.length+' orders';document.getElementById('rows').innerHTML=d.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.game)}<br>${esc(o.player)}</td><td>${esc(o.package_name)}</td><td>${o.currency==='KHR'?'៛':'$'}${o.amount}</td><td>${esc(o.status)}</td><td><select id="s-${esc(o.id)}"><option>PENDING</option><option>PAID</option><option>DELIVERED</option><option>REJECTED</option></select><button onclick="updateStatus('${esc(o.id)}')">Save</button></td></tr>`).join('')}
async function updateStatus(id){const token=document.getElementById('token').value,status=document.getElementById('s-'+id).value;const r=await fetch('/api/admin/orders',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({id,status})});alert(r.ok?'Updated':'Update failed');if(r.ok)load()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
