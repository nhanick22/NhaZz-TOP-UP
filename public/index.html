<!DOCTYPE html>

<html lang="km">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#080d1d">

<title>NHAZZ TOP UP | Fortnite V-Bucks</title>

<style>

:root {

  --bg:#080d1d;

  --panel:#111a31;

  --panel2:#172442;

  --blue:#38bdf8;

  --purple:#8b5cf6;

  --gold:#ffd166;

  --white:#fff;

  --muted:#aab6d0;

}

* {box-sizing:border-box}

body {

  margin:0;

  background:var(--bg);

  color:var(--white);

  font-family:Arial,sans-serif;

}

a {text-decoration:none;color:inherit}

header {

  height:75px;

  padding:0 6%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:#0b1225;

  border-bottom:1px solid #253452;

}

.logo {

  font-size:23px;

  font-weight:900;

  letter-spacing:1px;

}

.logo span {color:var(--gold)}

.support {

  color:var(--blue);

  font-weight:bold;

  font-size:14px;

}

.hero {

  min-height:410px;

  padding:65px 20px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  background:

    linear-gradient(130deg,#102d58,#17133d 55%,#080d1d);

  position:relative;

  overflow:hidden;

}

.hero:before,.hero:after {

  content:"";

  position:absolute;

  width:250px;

  height:250px;

  border:2px solid #ffffff12;

  transform:rotate(45deg);

}

.hero:before {left:-120px;top:60px}

.hero:after {right:-120px;bottom:-100px}

.hero-content {position:relative;z-index:1}

.hero-label {

  display:inline-block;

  padding:7px 15px;

  border:1px solid #ffffff45;

  border-radius:30px;

  background:#ffffff12;

  color:var(--gold);

  font-size:12px;

  font-weight:bold;

  letter-spacing:2px;

}

.hero h1 {

  font-size:clamp(38px,7vw,65px);

  line-height:1.05;

  margin:20px 0 12px;

  font-weight:1000;

  text-shadow:0 5px 25px #0008;

}

.hero h1 span {color:var(--gold)}

.hero p {

  color:#d5def5;

  font-size:16px;

}

.hero-button {

  display:inline-block;

  margin-top:17px;

  background:linear-gradient(100deg,#f5b942,#ffe08a);

  color:#15172a;

  padding:14px 32px;

  border-radius:9px;

  font-weight:900;

  box-shadow:0 8px 25px #e8a82d40;

}

.container {

  width:min(1050px,92%);

  margin:45px auto;

}

.section-title {

  text-align:center;

  margin-bottom:30px;

}

.section-title small {

  color:var(--blue);

  letter-spacing:3px;

  font-weight:bold;

}

.section-title h2 {

  font-size:30px;

  margin:8px 0;

}

.section-title p {color:var(--muted)}

.packages {

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:17px;

}

.package {

  background:linear-gradient(160deg,#192847,#10182d);

  border:1px solid #344568;

  border-radius:16px;

  padding:22px 13px;

  text-align:center;

  cursor:pointer;

  position:relative;

  transition:.2s;

}

.package:hover {

  transform:translateY(-5px);

  border-color:var(--blue);

}

.package.active {

  border:2px solid var(--gold);

  background:linear-gradient(160deg,#293b60,#201c48);

  box-shadow:0 0 25px #8b5cf633;

}

.coin {

  width:83px;

  height:83px;

  margin:0 auto 15px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:linear-gradient(145deg,#fff1a8,#e8a82d,#a65d13);

  border:5px solid #ffe9a0;

  box-shadow:0 5px 18px #0006,inset 0 0 0 3px #b8751d;

  color:#15274a;

  font-size:30px;

  font-weight:1000;

  text-shadow:1px 1px #fff9;

}

.package h3 {

  font-size:19px;

  margin:5px 0;

}

.package .usd {

  color:var(--gold);

  font-size:23px;

  font-weight:900;

  margin-top:12px;

}

.package .khr {

  color:#b8c8e9;

  font-size:14px;

  margin-top:4px;

}

.package .select-text {

  margin-top:15px;

  padding:9px;

  border-radius:7px;

  background:#26385b;

  font-weight:bold;

  font-size:13px;

}

.package.active .select-text {

  background:var(--gold);

  color:#15172a;

}

  margin:45px auto;
