<label for="player">ឈ្មោះអតិថិជន</label>
<input id="player" placeholder="បញ្ចូលឈ្មោះរបស់អ្នក">

<label for="contact">Telegram ឬ លេខទូរស័ព្ទ</label>
<input id="contact" placeholder="ព័ត៌មានសម្រាប់ទាក់ទងអ្នក">

<div class="summary">
  <div class="summary-row">
    <span>Game</span><b>Fortnite</b>
  </div>
  <div class="summary-row">
    <span>Package</span><b id="sPackage">Not selected</b>
  </div>
  <div class="summary-row">
    <span>USD</span><b id="sPrice">$0.00</b>
  </div>
  <div class="summary-row">
    <span>KHR</span><b id="sKHR">0៛</b>
  </div>
  <div class="summary-row total">
    <span>TOTAL</span><b id="sTotal">$0.00</b>
  </div>
</div>

<button class="buy-button" id="create">CREATE ORDER</button>

<div class="notice">
  ការបង្កើត Order មិនមែនជាការបញ្ជាក់ថាបានបង់ប្រាក់ ឬបានទទួល V-Bucks ទេ។
  សូមរង់ចាំការបញ្ជាក់ពី Admin មុនពេលបង់ប្រាក់។
</div>

<div id="result">
  <h3>YOUR ORDER CREATED</h3>
  <p>Order ID: <b id="orderId"></b></p>
  <img src="/khqr.png.jpg" alt="NHAZZ TOP UP KHQR">
  <p class="sub">
    សូមទាក់ទង Admin ដើម្បីផ្ទៀងផ្ទាត់ Order និងទទួលការណែនាំអំពីការទូទាត់។
  </p>
  <a id="telegramOrder" class="telegram-button"
     href="https://t.me/Nhamick"
     target="_blank" rel="noopener">
    SEND ORDER TO TELEGRAM
  </a>
</div>
